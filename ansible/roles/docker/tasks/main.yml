---
- name: Remove old Docker packages (if any)
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
    purge: yes
  tags: [ 'docker' ]

- name: Ensure required packages are installed
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - gzip
    state: present
    update_cache: yes
  tags: [ 'docker' ]

- name: Ensure keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: [ 'docker' ]

- name: Download Docker GPG key
  get_url:
    url: "{{ docker_repo_url }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  environment:
    http_proxy: "{{ proxy_url | default(omit) }}"
    https_proxy: "{{ proxy_url | default(omit) }}"
  tags: [ 'docker' ]

- name: Dearmor Docker GPG key
  command: >-
    bash -c 'gpg --dearmor < /etc/apt/keyrings/docker.asc > /etc/apt/keyrings/docker.gpg'
  args:
    creates: /etc/apt/keyrings/docker.gpg
  tags: [ 'docker' ]

- name: Ensure Docker GPG key permissions
  file:
    path: /etc/apt/keyrings/docker.gpg
    mode: '0644'
    state: file
  tags: [ 'docker' ]

- name: Set dpkg architecture for Docker repo
  set_fact:
    dpkg_arch: "{{ dpkg_arch_map.get(ansible_architecture, ansible_architecture) }}"
  tags: [ 'docker' ]

- name: Add Docker APT repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: '0644'
    content: |
      deb [arch={{ dpkg_arch }} signed-by=/etc/apt/keyrings/docker.gpg] {{ docker_repo_url }} {{ ansible_distribution_release }} stable
  tags: [ 'docker' ]

- name: Update apt cache
  apt:
    update_cache: yes
  tags: [ 'docker' ]

- name: Install Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: [ 'docker' ]

- name: Configure Docker service proxy
  copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      Environment="HTTP_PROXY={{ proxy_url }}" "HTTPS_PROXY={{ proxy_url }}" "NO_PROXY={{ no_proxy }}"
  notify:
    - systemd daemon-reload
    - restart docker
  when: proxy_url is defined
  tags: [ 'docker' ]

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: yes
  tags: [ 'docker' ]
